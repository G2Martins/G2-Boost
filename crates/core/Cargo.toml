[package]
name = "g2boost-core"
description = "G2 Boost core: disk scan, cleanup catalog, network diagnostics, Windows tweaks (no shell spawning)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "g2boost_core"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rayon = "1"
# `#[implement]` (COM callbacks) expands to `::windows_core` paths; same version `windows` uses.
windows-core = "0.62"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_WiFi",
  "Win32_System_IO",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Wdk_System_SystemServices",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Power",
  "Win32_System_Memory",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_Graphics_Dxgi",
  "Win32_System_Ioctl",
  "Win32_System_TpmBaseServices",
  "Win32_System_Performance",
  "Win32_System_Wmi",
  "Win32_System_Restore",
  "Win32_System_Rpc",
  "Win32_NetworkManagement_Ndis",
  "Win32_System_AssessmentTool",
  "Win32_Devices_Display",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_Networking_WinSock",
  "ApplicationModel",
  "Win32_Graphics_Imaging",
  "Wdk_Graphics_Direct3D",
  "Win32_System_EventLog",
  "Win32_System_Time",
  "Win32_System_Diagnostics_Etw",
