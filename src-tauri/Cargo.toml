[package]
name = "g2-boost"
description = "G2 Boost — disk analyzer, Windows cleaner, network tools and game performance tweaks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix keeps the lib name unique vs the bin name on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "g2_boost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
g2boost-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { workspace = true }
serde_json = { workspace = true }
